name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans the whole history, not only the checked-out tree.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage (100% thresholds enforced)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install the browser the end to end test drives
        run: npx playwright install --with-deps chromium

      - name: Browser end to end test
        run: npm run e2e
        env:
          # The platform's socket is played by the test, so these need to parse, not to work.
          ASSEMBLYAI_API_KEY: ci-placeholder-not-a-real-key
          TWICEHEARD_SECRET: ci-placeholder-secret-at-least-32-chars
          TWICEHEARD_WEBHOOK_SECRET: ci-placeholder-webhook-at-least-32-chars

      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
